# Install with: make setup
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  # Local hooks: tool versions are pinned by uv.lock.
  - repo: local
    hooks:
      - { id: ruff-check, name: ruff check, entry: uv run ruff check --force-exclude, language: system, types: [python] }
      - { id: ruff-format, name: ruff format, entry: uv run ruff format --force-exclude, language: system, types: [python] }
      - { id: mypy, name: mypy, entry: uv run mypy, language: system, types: [python], pass_filenames: false }
      - { id: uv-lock, name: uv.lock is up to date, entry: uv lock --check, language: system, files: 'pyproject\.toml$|^uv\.lock$', pass_filenames: false }
  - repo: local
    hooks:
      - id: commit-message
        name: commit message (Conventional Commits)
        entry: '^(feat|fix|docs|test|refactor|perf|build|ci|chore|security|revert)(\([a-z0-9_-]+\))?!?: .+|^Merge |^Revert '
        language: pygrep
        args: [--negate, --multiline]
        stages: [commit-msg]
default_install_hook_types: [pre-commit, commit-msg]
