# User-facing texts in English. The three files hold the same keys and the same {placeholders}.
status:
  ok: "OK"
  warn: "Warning"
  critical: "Critical"
  info: "Information"
  unknown: "Unknown"
banner:
  problem: "{title}: {summary}"
  stale: "The data is out of date"
  all_ok: "Everything is working"
  nothing_checked: "Nothing could be checked"
anomaly:
  hidden_value: "hidden value"
  reason:
    permission_denied: "access denied"
    locked: "the database is locked"
    other: "read error"
  message:
    source_missing: "{source} cannot be found. Hermes may be stopped, or the data folder may be wrongly mounted."
    source_unreadable: "{source} cannot be read: {reason}."
    parse_error: "{source} cannot be understood (invalid format)."
    unexpected_value: "{field} is “{value}”, a value STETHO does not know. Expected: {expected}."
    schema_changed: "The format of {source} has changed ({field}). Hermes may have been updated."
    implausible_value: "{field} = {value} is not plausible."
    sensor_error: "The {sensor} sensor met an error."
    sensor_timeout: "The {sensor} sensor did not answer in time."
    action_failed: "The action {action} failed (exit code {exit_code})."
    action_failed_target: "The action {action} on {target} failed (exit code {exit_code})."
    action_timeout: "The action {action} did not finish within {timeout} s."
    action_timeout_target: "The action {action} on {target} did not finish within {timeout} s."
    action_unexpected_output: "The action {action} answered something unexpected. See the details."
    action_unexpected_output_target: "The action {action} on {target} answered something unexpected. See the details."
    action_unverified: "The action {action} was started, but its effect cannot be seen."
    action_unverified_target: "The action {action} on {target} was started, but its effect cannot be seen."
    proxy_denied: "The Docker proxy refused the action {action}. Check this now."
    proxy_denied_target: "The Docker proxy refused the action {action} on {target}. Check this now."
duration:
  seconds: "{count} s"
  minutes: "{count} min"
  hours: "{count} h"
  days: "{count} d"
gateway:
  title: "Hermes (gateway)"
  group: "Availability"
  summary:
    online: "Online · last sign of life {age} ago"
    online_unknown_value: "Online, but STETHO does not know one of the reported values"
    deliberate_stop: "Hermes was stopped on purpose"
    stopped: "Hermes is stopped"
    startup_failed: "Hermes could not start"
    watchdog: "Hermes was stopped by its internal monitoring"
    command_waiting: "A command was sent to Hermes {age} ago; no sign of life since"
    command_down: "No sign of life since a command sent {age} ago"
    down: "Hermes has not answered for {age}"
    late: "Hermes is slow to answer · last sign of life {age} ago"
    no_date: "The date of the last sign of life cannot be used"
    degraded: "Hermes works in degraded mode"
    starting: "Hermes is starting"
    draining: "Hermes is finishing its current work"
    unknown_state: "Hermes is in a state STETHO does not know"
    missing: "Hermes cannot be checked: its state file cannot be found"
    missing_too_long: "No sign of life from Hermes for {age}"
    unusable: "The state of Hermes cannot be read"
    no_gateway: "There is no gateway to check"
    profiles_unchecked: "Some profiles could not be checked"
    all_online: "All gateways are online ({count})"
    of_profile: "{name}: {summary}"
  advice:
    deliberate_stop: "If this stop is no longer wanted, start Hermes again."
    start_again: "Read the Hermes logs, then start the Hermes gateway again."
    fix_then_start: "Read the Hermes logs, fix the cause, then start the gateway again."
    check_container: "Check that the Hermes container is running and read its logs. Restart it if needed."
    wait: "Wait a few minutes. If nothing changes, read the Hermes logs."
    wait_and_check_load: "Wait a few minutes. If it lasts, read the Hermes logs and check the load of the server."
    check_clock: "Check the clock of the server and the version of Hermes."
    check_platforms: "Check the connections of the platforms and read the Hermes logs."
    check_version: "Check the version of Hermes: STETHO may need an update."
    check_running_and_mount: "Check that Hermes is running and that its data folder is correctly mounted."
    check_version_and_access: "Check the version of Hermes and that STETHO can read its data."
    check_profile_list: "Check the list of profiles in the STETHO settings."
    check_intent: "Check the version of Hermes and whether this stop was intended, then read the logs."
    check_profile_names: "Check the names of the folders in the Hermes profiles folder: one cannot be a profile name."
    restarts_all: "Restarting the container interrupts every gateway, including those that work."
    of_profile: "Profile {name}: {advice}"
    check_profiles_access: "Check that STETHO can read the profiles folder of Hermes."
  detail:
    last_sign_of_life: "Last sign of life"
    stop_reason: "Stop reason"
    active_agents: "Active agents"
    hermes_version: "Hermes version"
    last_unclean_stop: "Last unclean stop"
  value:
    ago: "{age} ago"
    reason_not_shown: "Not shown: see the Hermes logs"
    unclean_stop: "Noticed on {date}"
    unclean_stop_oom: "Noticed on {date}, possibly out of memory"
  exit_reason:
    loop_liveness_watchdog: "Hermes was frozen"
    shutdown_watchdog: "Hermes was stuck while stopping"
probe:
  advice:
    sensor_error: "Read the STETHO log, which gives the type and place of the error."
    sensor_timeout: "If it lasts, check the size of the Hermes files and the sensor time limit."
  detail:
    error: "Internal error"
api:
  docs:
    title: "STETHO API"
    intro: "Made from the API contract. Descriptions are in English."
    not_served: "Not served yet"
  error:
    invalid_request: "The request is not valid."
    invalid_host: "The request used a host name that is not allowed."
    unauthorized: "A password is required."
    not_found: "Not found."
    method_not_allowed: "This method is not accepted."
    internal_error: "STETHO met an error."
page:
  not_assessed: "Not assessed"
  title: "Hermes status"
  refresh_failed: "The page can no longer be refreshed. What is shown may be out of date."
  no_script: "JavaScript is off: reload the page to update it."
  checked: "Checked"
  never_checked: "No reading yet"
  ago: "{age} ago"
  problems: "Problems"
  details: "Details"
  anomalies: "Anomalies ({count})"
  column:
    status: "Status"
    source: "Source"
    problem: "Problem"
    advice: "What to do"
  anomaly:
    module: "Module"
    source: "Source"
    code: "Code"
    detail: "Detail"
    received: "Received"
    expected: "Expected"
    first_seen: "First seen"
    last_seen: "Last seen"
    count: "Times"
