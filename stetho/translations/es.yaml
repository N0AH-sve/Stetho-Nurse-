    late: "Hermes tarda en responder · última señal de vida hace {age}"
    no_date: "La fecha de la última señal de vida no se puede usar"
    degraded: "Hermes funciona en modo degradado"
    starting: "Hermes está arrancando"
    draining: "Hermes está terminando su trabajo en curso"
